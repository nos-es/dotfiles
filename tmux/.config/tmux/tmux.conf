# <C-r> to reload configuration
unbind r
bind r source-file ~/.config/tmux/tmux.conf
set -g mouse on
set -g status-position top

# vim motions to switch between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Open new window with current path
bind c new-window -c "#{pane_current_path}"

# Open new vertical pane with current path
bind % split-window -h -c "#{pane_current_path}"

# Open new horizontal pane with current path
bind '"' split-window -v -c "#{pane_current_path}"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Nybkox/tmux-kanagawa'
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'

set -g @kanagawa-theme 'dragon'
# available plugins: battery, cpu-usage, git, gpu-usage, ram-usage, tmux-ram-usage, network, network-bandwidth, network-ping, ssh-session, attached-clients, network-vpn, weather, time, mpc, spotify-tui, playerctl, kubernetes-context, synchronize-panes
set -g @kanagawa-plugins "playerctl"
set -g @kanagawa-ignore-window-colors false

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# First: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm into the home directory
run '~/.tmux/plugins/tpm/tpm'

# Use <Leader> + I to install the plugins after cloning tpm!
